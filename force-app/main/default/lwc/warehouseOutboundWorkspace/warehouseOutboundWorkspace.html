<template>
    <lightning-card title="Outbound Fulfillment" icon-name="standard:orders">
        <lightning-button slot="actions" label="Refresh" icon-name="utility:refresh" onclick={handleRefresh}></lightning-button>

        <template lwc:if={isSaving}>
            <lightning-spinner alternative-text="Saving outbound operation" size="small"></lightning-spinner>
        </template>

        <lightning-tabset>
            <lightning-tab label="Allocation">
                <div class="slds-p-horizontal_small slds-p-bottom_medium">
                    <template lwc:if={hasAllocationRows}>
                        <lightning-datatable key-field="orderId" data={allocationRows} columns={orderColumns}
                            onrowaction={handleOrderAction} hide-checkbox-column>
                        </lightning-datatable>
                    </template>
                    <template lwc:else><div class="empty-state">No orders are waiting for allocation.</div></template>
                </div>
            </lightning-tab>

            <lightning-tab label="Picking">
                <div class="slds-p-horizontal_small slds-p-bottom_medium">
                    <template lwc:if={hasPickRows}>
                        <lightning-datatable key-field="taskId" data={pickRows} columns={pickColumns}
                            onrowaction={handlePickAction} hide-checkbox-column>
                        </lightning-datatable>
                    </template>
                    <template lwc:else><div class="empty-state">No open pick tasks.</div></template>

                    <template lwc:if={selectedPick}>
                        <section class="operation-panel slds-m-top_medium">
                            <div class="panel-heading">
                                <div><span class="eyebrow">PICK</span><h3>{selectedPick.taskNumber} · {selectedPick.productName}</h3></div>
                                <span class="quantity-pill">{selectedPick.remainingQuantity} remaining</span>
                            </div>
                            <div class="slds-grid slds-wrap slds-gutters">
                                <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-3">
                                    <lightning-input type="number" label="Picked quantity" min="0.01" step="0.01"
                                        max={selectedPick.remainingQuantity} value={pickQuantity} onchange={handlePickQuantity} required>
                                    </lightning-input>
                                </div>
                                <div class="slds-col slds-size_1-of-1 slds-large-size_2-of-3">
                                    <lightning-input label="Pick note" value={pickNotes} onchange={handlePickNotes}></lightning-input>
                                </div>
                            </div>
                            <p class="hint slds-m-top_x-small">Source bin: {selectedPick.sourceBin} · Order: {selectedPick.orderNumber}</p>
                            <div class="slds-m-top_medium slds-text-align_right">
                                <lightning-button variant="brand" label="Record Pick" onclick={submitPick} disabled={isSaving}></lightning-button>
                            </div>
                        </section>
                    </template>
                </div>
            </lightning-tab>

            <lightning-tab label="Packing">
                <div class="slds-p-horizontal_small slds-p-bottom_medium">
                    <template lwc:if={hasPackingRows}>
                        <lightning-datatable key-field="orderId" data={packingRows} columns={packColumns}
                            onrowaction={handlePackAction} hide-checkbox-column>
                        </lightning-datatable>
                    </template>
                    <template lwc:else><div class="empty-state">No fully picked orders are waiting to be packed.</div></template>

                    <template lwc:if={selectedPack}>
                        <section class="operation-panel slds-m-top_medium">
                            <div class="panel-heading">
                                <div><span class="eyebrow">PACK</span><h3>{selectedPack.orderNumber}</h3></div>
                                <span class="quantity-pill">{selectedPack.priority}</span>
                            </div>
                            <div class="slds-grid slds-wrap slds-gutters">
                                <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-3">
                                    <lightning-input type="number" label="Package weight" min="0" step="0.01"
                                        value={packageWeight} onchange={handlePackageWeight}>
                                    </lightning-input>
                                </div>
                                <div class="slds-col slds-size_1-of-1 slds-large-size_2-of-3">
                                    <lightning-input label="Packing note" value={packNotes} onchange={handlePackNotes}></lightning-input>
                                </div>
                            </div>
                            <div class="slds-m-top_medium slds-text-align_right">
                                <lightning-button variant="brand" label="Complete Packing" onclick={submitPack} disabled={isSaving}></lightning-button>
                            </div>
                        </section>
                    </template>
                </div>
            </lightning-tab>

            <lightning-tab label="Shipping">
                <div class="slds-p-horizontal_small slds-p-bottom_medium">
                    <template lwc:if={hasShippingRows}>
                        <lightning-datatable key-field="packageId" data={shippingRows} columns={shipColumns}
                            onrowaction={handleShipAction} hide-checkbox-column>
                        </lightning-datatable>
                    </template>
                    <template lwc:else><div class="empty-state">No packages are waiting at the shipping dock.</div></template>

                    <template lwc:if={selectedPackage}>
                        <section class="operation-panel slds-m-top_medium">
                            <div class="panel-heading">
                                <div><span class="eyebrow">SHIP</span><h3>{selectedPackage.packageNumber} · {selectedPackage.orderNumber}</h3></div>
                                <span class="quantity-pill">{selectedPackage.weight} weight</span>
                            </div>
                            <div class="slds-grid slds-wrap slds-gutters">
                                <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-3">
                                    <lightning-input label="Carrier" value={carrier} onchange={handleCarrier} required></lightning-input>
                                </div>
                                <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-3">
                                    <lightning-input label="Tracking number" value={trackingNumber} onchange={handleTracking} required></lightning-input>
                                </div>
                                <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-3">
                                    <lightning-input label="Shipping note" value={shipNotes} onchange={handleShipNotes}></lightning-input>
                                </div>
                            </div>
                            <div class="slds-m-top_medium slds-text-align_right">
                                <lightning-button variant="brand" label="Release Shipment" onclick={submitShip} disabled={isSaving}></lightning-button>
                            </div>
                        </section>
                    </template>
                </div>
            </lightning-tab>
        </lightning-tabset>
    </lightning-card>
</template>
